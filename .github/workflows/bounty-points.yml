name: bounty points

# Points are awarded from git history rather than a running scoreboard, so there
# is no service to host and nothing to game by clicking buttons. A contributor's
# score is the sum of the bounties whose PRs were actually merged.
#
# The award is only as trustworthy as the *files* the PR touched, not the words
# in its body: "Closes #N" is written by the contributor, so it is a claim, not
# proof. The validation step below refuses to pay for a bounty whose dataset the
# PR never touched.

on:
  pull_request:
    types: [closed]

# Least privilege: contents to push the ledger, issues to label the bounty.
# Nothing here reads or writes PR metadata beyond the event payload.
permissions:
  contents: write
  issues: write
  pull-requests: write   # gh pr view to verify the diff; gh pr create for fallback

jobs:
  award:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Find the bounty this PR closes
        id: bounty
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > /tmp/pr-body.md
          python - <<'PY'
          import json, os, pathlib, re, subprocess

          body = pathlib.Path('/tmp/pr-body.md').read_text()
          pr = os.environ['PR_NUMBER']

          def no_award(why):
              print(why)
              pathlib.Path('/tmp/award.json').write_text('{}')
              raise SystemExit(0)

          m = re.search(r'Closes #(\d+)', body, re.I)
          if not m:
              no_award('No "Closes #N" in the PR body; nothing to award.')

          number = m.group(1)
          raw = subprocess.run(
              ['gh', 'issue', 'view', number, '--json', 'body,title'],
              capture_output=True, text=True, check=True).stdout
          issue = json.loads(raw)
          meta_m = re.search(r'<!--\s*bounty:\s*(\{.*?\})\s*-->', issue['body'], re.S)
          if not meta_m:
              no_award(f'Issue #{number} has no bounty metadata.')

          meta = json.loads(meta_m.group(1))
          dataset = str(meta.get('dataset') or '').strip()

          # The body is contributor-written, so check the work actually landed in
          # the bounty's dataset. Without this, one merged frame anywhere could
          # legitimately say "Closes #N" for any well-paid bounty and collect it.
          files = json.loads(subprocess.run(
              ['gh', 'pr', 'view', pr, '--json', 'files'],
              capture_output=True, text=True, check=True).stdout)
          paths = [f.get('path', '') for f in files.get('files', [])]
          labels = [p for p in paths if '/labels/' in p and p.endswith('.txt')]
          if not labels:
              no_award(f'PR #{pr} changed no label files; nothing to award.')
          if dataset:
              expected = f'/datasets/{dataset}/labels/'
              stray = [p for p in labels if expected not in p]
              if stray:
                  no_award(
                      f'PR #{pr} closes bounty #{number} (dataset {dataset}) but '
                      f'changes labels outside it: {stray[:5]}')

          award = {
              'issue': int(number),
              'points': int(meta.get('points', 0)),
              'target': int(meta.get('target', 0)),
              'difficulty': float(meta.get('difficulty', 1.0)),
          }
          pathlib.Path('/tmp/award.json').write_text(json.dumps(award))
          print(f'Bounty #{number}: {award["points"]} points over {len(labels)} label file(s)')
          PY

      - name: Record the award
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, time

          award = json.loads(pathlib.Path('/tmp/award.json').read_text())
          if not award:
              raise SystemExit(0)

          ledger = pathlib.Path('docs/leaderboard.json')
          data = {'generated': '', 'totals': {}, 'prs': []}
          if ledger.exists():
              try:
                  data = json.loads(ledger.read_text())
              except json.JSONDecodeError:
                  pass

          author = os.environ['AUTHOR']
          # Idempotent: a re-run or a rebase must not pay twice.
          seen = {(p.get('pr'), p.get('issue')) for p in data.get('prs', [])}
          key = (int(os.environ['PR']), award['issue'])
          if key in seen:
              print('Already recorded; skipping.')
              raise SystemExit(0)

          data.setdefault('prs', []).append({
              'pr': int(os.environ['PR']),
              'issue': award['issue'],
              'author': author,
              'points': award['points'],
              'mergedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
          })
          totals = {}
          for entry in data['prs']:
              totals[entry['author']] = totals.get(entry['author'], 0) + entry.get('points', 0)
          data['totals'] = dict(sorted(totals.items(), key=lambda kv: -kv[1]))
          data['generated'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          ledger.write_text(json.dumps(data, indent=2) + '\n')

          docs = pathlib.Path('docs/LEADERBOARD.md')
          lines = ['# Bounty leaderboard', '',
                   f'_Updated {data["generated"]}_', '',
                   '| Points | Contributor |', '| ---: | :--- |']
          for who, pts in data['totals'].items():
              lines.append(f'| {pts} | @{who} |')
          lines += ['', 'Points are awarded when a bounty PR merges, not when it is opened.', '']
          docs.write_text('\n'.join(lines))
          print(f'Recorded {award["points"]} points for @{author}')
          PY

      - name: Commit the ledger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/leaderboard.json docs/LEADERBOARD.md; then
            echo "Ledger unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/leaderboard.json docs/LEADERBOARD.md
          git commit -m "chore: award bounty points for #$PR"

          # `main` is protected, and the bot is not an admin, so a direct push is
          # expected to be rejected. Fall back to a PR rather than failing the
          # award: the points are already computed, and a merge is a welcome
          # second pair of eyes on a payout.
          if git push 2>/dev/null; then
            echo "Pushed the ledger to main."
          else
            git switch -c "ledger/pr-$PR"
            git push -u origin "ledger/pr-$PR"
            gh pr create \
              --title "chore: award bounty points for #$PR" \
              --body "Automated ledger update after #$PR merged." \
              --base main || true
            echo "::notice::main is protected, so the ledger update was opened as a PR."
          fi

      - name: Mark the bounty done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess

          award = json.loads(pathlib.Path('/tmp/award.json').read_text())
          if not award:
              raise SystemExit(0)
          # The PR body's "Closes #N" already closes the issue on merge; this
          # only adds the label so the board can filter finished bounties out.
          subprocess.run(
              ['gh', 'issue', 'edit', str(award['issue']), '--add-label', 'bounty:done'],
              check=False,
          )
          PY
